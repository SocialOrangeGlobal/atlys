<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Signature Multicolor Brand Gradient -->
    <linearGradient id="plane-multi-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#00D65B" />
    </linearGradient>

    <!-- Subtle inner shadow/border gradient for premium black circle -->
    <linearGradient id="circle-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>

  <!-- Circular Black Background -->
  <circle cx="32" cy="32" r="30" fill="#000000" stroke="url(#circle-border)" stroke-width="1.5" />

  <!-- Flying Plane with Multicolor Gradient -->
  <g transform="translate(32, 32) rotate(45) scale(1.65) translate(-12, -12)">
    <path 
      d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z" 
      fill="url(#plane-multi-grad)" 
    />
  </g>
</svg>
