<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#00D65B" />
    </linearGradient>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Top Contrail Flight Line -->
  <line x1="14" y1="17" x2="38" y2="17" stroke="url(#brand-grad)" stroke-width="2" stroke-linecap="round" />

  <!-- Aeroplane Flying East -->
  <g transform="translate(40, 10) scale(0.55)">
    <path 
      d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"
      fill="#FFFFFF"
      transform="rotate(90 12 12)"
    />
  </g>

  <!-- GG Monogram -->
  <text 
    x="12" 
    y="49" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="28" 
    font-weight="900" 
    fill="#FFFFFF" 
    letter-spacing="-1"
  >G</text>

  <text 
    x="32" 
    y="49" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="28" 
    font-weight="900" 
    fill="url(#brand-grad)" 
    letter-spacing="-1"
  >G</text>

  <circle cx="51" cy="48" r="2.5" fill="#00D65B" />
</svg>
